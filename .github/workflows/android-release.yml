name: IQ Tunnel Public Builder — Signed Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Build, sign and publish a production APK and update manifest
        required: true
        type: boolean
        default: false
      source_ref:
        description: Private source ref (main for manual runs, or an exact 40-character commit SHA)
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: iq-tunnel-public-production-release
  cancel-in-progress: false

jobs:
  release:
    # Never expose production secrets or publish from a PR/feature branch.
    if: ${{ inputs.confirm_release == true && github.ref == 'refs/heads/main' }}
    environment:
      name: iq-tunnel-production
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout public builder workflow
        with:
          ref: main
          persist-credentials: false

      - name: Validate private source ref and read-only deploy key
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_DEPLOY_KEY: ${{ secrets.IQT_PROD_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != "main" && ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be main or a full 40-character commit SHA."
            exit 1
          fi
          test -n "$SOURCE_DEPLOY_KEY" || {
            echo "Missing Environment secret IQT_PROD_SOURCE_DEPLOY_KEY."
            exit 1
          }

      - name: Checkout exact private source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: loudply0-eng/IQ-Tunnel
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.IQT_PROD_SOURCE_DEPLOY_KEY }}
          path: .iqt-private-source
          persist-credentials: false

      - name: Checkout private main history for trust verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: loudply0-eng/IQ-Tunnel
          ref: main
          ssh-key: ${{ secrets.IQT_PROD_SOURCE_DEPLOY_KEY }}
          path: .iqt-private-main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected source commit belongs to private main history
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C .iqt-private-source rev-parse HEAD)"
          MAIN_SHA="$(git -C .iqt-private-main rev-parse HEAD)"
          if ! git -C .iqt-private-main cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null; then
            echo "Selected source commit is not present in private main history."
            exit 1
          fi
          if ! git -C .iqt-private-main merge-base --is-ancestor "$SOURCE_SHA" "$MAIN_SHA"; then
            echo "Selected source commit is not an ancestor of private main."
            exit 1
          fi
          echo "Verified private source commit $SOURCE_SHA is reachable from main at $MAIN_SHA"

      - name: Populate build workspace from verified private source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C .iqt-private-source rev-parse HEAD)"
          # Keep the public builder's Actions workflows and Git metadata, while
          # every Flutter file, asset, test, plugin and build helper is sourced
          # from the verified private commit selected above.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.iqt-private-source/' \
            --exclude='.iqt-private-main/' \
            .iqt-private-source/ ./
          rm -rf .iqt-private-source .iqt-private-main
          echo "Using verified private IQ Tunnel source commit: $SOURCE_SHA"
          test -s pubspec.yaml
          test -s lib/main.dart
          test -s tool/patch_libxray_android.py
          test -s packages/iqtunnel_xray/pubspec.yaml

      - name: Free unused runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /opt/ghc
          df -h /
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          cache: false
      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.IQT_PROD_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.IQT_PROD_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.IQT_PROD_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.IQT_PROD_ANDROID_KEY_PASSWORD }}
          ORACLE_SSH_KEY: ${{ secrets.IQT_PROD_ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.IQT_PROD_ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.IQT_PROD_ORACLE_USER }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.IQT_PROD_ORACLE_KNOWN_HOSTS }}
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.IQT_PROD_UPDATE_PRIVATE_KEY_BASE64 }}
          SOURCE_DEPLOY_KEY: ${{ secrets.IQT_PROD_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$ORACLE_SSH_KEY" || { echo "Missing ORACLE_SSH_KEY"; exit 1; }
          test -n "$ORACLE_HOST" || { echo "Missing ORACLE_HOST"; exit 1; }
          test -n "$ORACLE_USER" || { echo "Missing ORACLE_USER"; exit 1; }
          test -n "$ORACLE_KNOWN_HOSTS" || { echo "Missing ORACLE_KNOWN_HOSTS"; exit 1; }
          test -n "$UPDATE_PRIVATE_KEY_BASE64" || { echo "Missing UPDATE_PRIVATE_KEY_BASE64"; exit 1; }
          test -n "$SOURCE_DEPLOY_KEY" || { echo "Missing IQT_PROD_SOURCE_DEPLOY_KEY"; exit 1; }

      - name: Install Go for the pinned libXray build
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Cache Go modules and build cache for libXray
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-libxray-v26.11.9-go1.27.3-gomobile-v0.0.0-20261011034528-197770444867
          restore-keys: |
            ${{ runner.os }}-libxray-v26.11.9-go1.27.3-

      - name: Build the pinned official libXray Android AAR
        env:
          LIBXRAY_GOMOBILE_VERSION: v0.0.0-20261011034528-197770444867
          LIBXRAY_ANDROID_API: '21'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/test/tool" -p "*_test.py" -v
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          git init /tmp/libXray
          git -C /tmp/libXray remote add origin https://github.com/XTLS/libXray.git
          git -C /tmp/libXray fetch --depth=1 origin 5a0f7d8d1c28b34afb5727b04b26a10f6dbac7e3
          git -C /tmp/libXray checkout --detach FETCH_HEAD
          test "$(git -C /tmp/libXray rev-parse HEAD)" = "5a0f7d8d1c28b34afb5727b04b26a10f6dbac7e3"
          python3 "$GITHUB_WORKSPACE/tool/patch_libxray_android.py" /tmp/libXray
          cd /tmp/libXray
          gofmt -w android_wrapper.go xray/xray.go
          git diff --check
          python3 build/main.py android
          test -s libXray.aar
          python3 "$GITHUB_WORKSPACE/tool/install_libxray_aar.py" \
            "$PWD/libXray.aar" \
            "$GITHUB_WORKSPACE/packages/iqtunnel_xray/android"
          sha256sum "$PWD/libXray.aar"
          git init /tmp/xray-core-source
          git -C /tmp/xray-core-source remote add origin https://github.com/XTLS/Xray-core.git
          git -C /tmp/xray-core-source fetch --depth=1 origin 676eaf66f8f05d4d558ee7a74b4736623d3feeb9
          git -C /tmp/xray-core-source checkout --detach FETCH_HEAD
          test "$(git -C /tmp/xray-core-source rev-parse HEAD)" = "676eaf66f8f05d4d558ee7a74b4736623d3feeb9"
          mkdir -p "$GITHUB_WORKSPACE/build/third-party"
          git -C /tmp/xray-core-source archive --format=tar --prefix=xray-core-v26.11.9/ HEAD | gzip -n > "$GITHUB_WORKSPACE/build/third-party/xray-core-v26.11.9-source.tar.gz"
          sha256sum "$GITHUB_WORKSPACE/build/third-party/xray-core-v26.11.9-source.tar.gz" > "$GITHUB_WORKSPACE/build/third-party/xray-core-v26.11.9-source.tar.gz.sha256"
          test -s "$GITHUB_WORKSPACE/build/third-party/xray-core-v26.11.9-source.tar.gz"


      - name: Verify generated libXray Android binding signatures
        run: |
          set -euo pipefail
          LIBXRAY_JAR=packages/iqtunnel_xray/android/libs/libXray.jar
          test -s "$LIBXRAY_JAR"
          javap -classpath "$LIBXRAY_JAR" libXray.LibXray > /tmp/libxray-api.txt
          javap -classpath "$LIBXRAY_JAR" libXray.DialerController > /tmp/libxray-dialer.txt
          grep -q 'setTunFd(long)' /tmp/libxray-api.txt
          grep -q 'resetTunFd()' /tmp/libxray-api.txt
          grep -q 'registerDialerController' /tmp/libxray-api.txt
          grep -q 'setDNS' /tmp/libxray-api.txt
          grep -q 'getTrafficStats()' /tmp/libxray-api.txt
          grep -q 'protectFd(long)' /tmp/libxray-dialer.txt

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --project-name iq_tunnel --org com.iqtunnel /tmp/iq_tunnel_scaffold
          cp -a /tmp/iq_tunnel_scaffold/android ./android

      - name: Configure Android Gradle compatibility
        run: |
          set -euo pipefail
          PROPERTIES=android/gradle.properties
          touch "$PROPERTIES"
          if ! grep -q '^android.newDsl=' "$PROPERTIES"; then
            echo 'android.newDsl=false' >> "$PROPERTIES"
          fi
      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          lines = p.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.lstrip().startswith("compileSdk =")]
          if len(matches) != 1:
              raise SystemExit(f"Expected one compileSdk assignment, found {len(matches)}")
          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = indent + "compileSdk = 36"
          p.write_text(chr(10).join(lines) + chr(10))
          PY

      - name: Apply IQ Tunnel branding
        run: python3 tool/apply_android_branding.py

      - name: Add APK installer handoff permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s = s.replace("<application", permission + "    <application", 1)
          internet_permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", internet_permission + "    <application", 1)
          # Local OpenWrt LuCI commonly uses HTTP. The app-level OpenWrt
          # client rejects clear-text URLs outside private/local host ranges.
          if "android:usesCleartextTraffic=" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY

      - name: Configure Android backup policy
        run: python3 .github/scripts/configure_android_backup_policy.py

      - name: Configure permanent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.IQT_PROD_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.IQT_PROD_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.IQT_PROD_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.IQT_PROD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = "import java.util.Properties\n" + s
          s = s.replace("android {", """android {
              val keystoreProperties = Properties()
              val keystorePropertiesFile = rootProject.file("key.properties")
              require(keystorePropertiesFile.exists()) { "Release signing properties are missing" }
              keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
          """, 1)
          s = s.replace("    buildTypes {", """    signingConfigs {
                  create("release") {
                      storeFile = file(keystoreProperties.getProperty("storeFile"))
                      storePassword = keystoreProperties.getProperty("storePassword")
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                  }
              }

              buildTypes {""", 1)
          needle = 'signingConfig = signingConfigs.getByName("debug")'
          if s.count(needle) != 1:
              raise SystemExit(f"Expected exactly one generated debug signing assignment, found {s.count(needle)}")
          s = s.replace(needle, 'signingConfig = signingConfigs.getByName("release")', 1)
          if s.count('signingConfig = signingConfigs.getByName("release")') != 1:
              raise SystemExit("Release signing assignment was not applied exactly once")
          p.write_text(s)
          PY
          chmod 600 android/key.properties android/app/upload-keystore.jks
          test "$ANDROID_KEY_ALIAS" = "iq-tunnel" || { echo "Unexpected Android signing alias"; exit 1; }
          KEY_CERT_SHA256="$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          EXPECTED_KEY_CERT_SHA256='cc96499ac23bf3a9101b2a7cc7d19feef852e61a5902860abe15218a8968b017'
          test "$KEY_CERT_SHA256" = "$EXPECTED_KEY_CERT_SHA256" || { echo "Configured Android keystore certificate does not match the approved IQ Tunnel release key"; exit 1; }

      - name: Verify update signing key matches app public key
        env:
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.IQT_PROD_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$UPDATE_PRIVATE_KEY_BASE64" | tr -d '[:space:]' | base64 --decode > /tmp/iq-update-private.pem
          openssl pkey -in /tmp/iq-update-private.pem -pubout -out /tmp/iq-update-public.pem
          DER_PUBLIC="$(openssl pkey -in /tmp/iq-update-private.pem -pubout -outform DER 2>/dev/null | tail -c 32 | base64 -w0)"
          EXPECTED_PUBLIC='4eOsYpXniRBp1ZTJjq5c3HbDW8tCvWbv1fr5PLVl+sk='
          test "$DER_PUBLIC" = "$EXPECTED_PUBLIC" || { echo "Update signing key does not match the app's pinned public key"; exit 1; }

      - name: Resolve dependencies, analyze and test
        run: |
          dart pub cache repair
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
          flutter test

      - name: Prepare monotonic release version
        id: release_meta
        env:
          UPDATE_MANIFEST_URL: https://mahmoudaljuorany.store/updates/iq-tunnel/manifest.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          pubspec = open("pubspec.yaml", encoding="utf-8").read()
          match = re.search(r"^version:\s*([0-9.]+)\+([0-9]+)\s*$", pubspec, re.M)
          if not match:
              raise SystemExit("pubspec.yaml version must use version+buildNumber")
          version = match.group(1)
          source_build = int(match.group(2))
          request = urllib.request.Request(
              os.environ["UPDATE_MANIFEST_URL"],
              headers={"Cache-Control": "no-cache, no-store", "Pragma": "no-cache", "User-Agent": "IQ-Tunnel-Release"},
          )
          current_build = 0
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if not response.geturl().startswith("https://"):
                      raise SystemExit("Published manifest redirected away from HTTPS.")
                  raw = response.read(64 * 1024 + 1)
                  if len(raw) > 64 * 1024:
                      raise SystemExit("Published update manifest exceeds 64 KiB.")
                  current = json.loads(raw)
              raw_current_build = current.get("build_number")
              # bool is a subclass of int in Python; require an actual JSON integer.
              if type(raw_current_build) is not int or raw_current_build < 0:
                  raise SystemExit("Published build number must be a non-negative integer.")
              current_build = raw_current_build
          except urllib.error.HTTPError as error:
              if error.code != 404 or not error.geturl().startswith("https://"):
                  raise
          build_number = max(source_build, current_build + 1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + version + "\n")
              output.write("build_number=" + str(build_number) + "\n")
          print("Prepared release version " + version + "+" + str(build_number))
          PY

      - name: Build signed APK
        env:
          UPDATE_MANIFEST_URL: https://mahmoudaljuorany.store/updates/iq-tunnel/manifest.json
          UPDATE_PUBLIC_KEY: 4eOsYpXniRBp1ZTJjq5c3HbDW8tCvWbv1fr5PLVl+sk=
        run: flutter build apk --release --build-number="${{ steps.release_meta.outputs.build_number }}" --dart-define=UPDATE_MANIFEST_URL="$UPDATE_MANIFEST_URL" --dart-define=UPDATE_PUBLIC_KEY="$UPDATE_PUBLIC_KEY"

      - name: Verify packaged Android backup policy with AAPT2
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -n "$AAPT2" || { echo "Android Build Tools aapt2 is required for the release backup gate."; exit 1; }
          python3 .github/scripts/verify_android_backup_policy.py \
            --apk "$APK" \
            --aapt2 "$AAPT2" \
            --evidence-dir build/android-backup-policy-evidence

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload Android backup-policy verification evidence
        with:
          name: iq-tunnel-android-backup-policy-evidence
          path: build/android-backup-policy-evidence/
          if-no-files-found: error
          retention-days: 30


      - name: Ensure release build number advances the published manifest
        env:
          UPDATE_MANIFEST_URL: https://mahmoudaljuorany.store/updates/iq-tunnel/manifest.json
          NEW_BUILD_NUMBER: ${{ steps.release_meta.outputs.build_number }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request

          url = os.environ["UPDATE_MANIFEST_URL"]
          request = urllib.request.Request(
              url,
              headers={
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
              "User-Agent": "IQ-Tunnel-Updater",
          },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  final_url = response.geturl()
                  if not final_url.startswith("https://"):
                      raise SystemExit("Published update manifest redirected away from HTTPS.")
                  manifest_bytes = response.read(64 * 1024 + 1)
                  if len(manifest_bytes) > 64 * 1024:
                      raise SystemExit("Published update manifest exceeds the 64 KiB limit.")
                  current = json.loads(manifest_bytes)
          except urllib.error.HTTPError as error:
              if error.code == 404 and error.geturl().startswith("https://"):
                  print("No published manifest exists; allowing the first signed release.")
                  current = None
              else:
                  raise
          except Exception as error:
              raise SystemExit("Could not verify the published update manifest: " + str(error))

          new_build = int(os.environ["NEW_BUILD_NUMBER"])
          if current is not None:
              try:
                  version = current["version"]
                  raw_current_build = current["build_number"]
                  # Reject floats and booleans instead of silently truncating/coercing them.
                  if type(raw_current_build) is not int or raw_current_build < 0:
                      raise ValueError("build_number must be a non-negative JSON integer")
                  current_build = raw_current_build
                  download_url = current["download_url"]
                  sha256 = str(current["sha256"]).lower()
                  notes = current.get("notes", "")
                  signature = base64.b64decode(current["signature"], validate=True)
              except Exception as error:
                  raise SystemExit("Published update manifest has missing or invalid fields.") from error

              if not isinstance(version, str) or not version:
                  raise SystemExit("Published manifest version is invalid.")
              if not isinstance(download_url, str) or urllib.parse.urlparse(download_url).scheme != "https":
                  raise SystemExit("Published manifest APK URL must use HTTPS.")
              if not isinstance(notes, str) or len(signature) != 64:
                  raise SystemExit("Published manifest signature or release notes are invalid.")
              if len(sha256) != 64 or any(ch not in "0123456789abcdef" for ch in sha256):
                  raise SystemExit("Published manifest SHA-256 digest is invalid.")

              signed_payload = {
                  "version": version,
                  "build_number": current_build,
                  "download_url": download_url,
                  "sha256": sha256,
                  "notes": notes,
              }
              payload_bytes = json.dumps(
                  signed_payload, ensure_ascii=False, separators=(",", ":")
              ).encode("utf-8")

              with tempfile.NamedTemporaryFile(delete=False) as payload_file:
                  payload_file.write(payload_bytes)
                  payload_path = payload_file.name
              with tempfile.NamedTemporaryFile(delete=False) as signature_file:
                  signature_file.write(signature)
                  signature_path = signature_file.name
              try:
                  subprocess.run(
                      [
                          "openssl", "pkeyutl", "-verify", "-rawin", "-pubin",
                          "-inkey", "/tmp/iq-update-public.pem",
                          "-sigfile", signature_path, "-in", payload_path,
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                  )
              except subprocess.CalledProcessError as error:
                  raise SystemExit("Published update manifest has an invalid Ed25519 signature.") from error
              finally:
                  os.unlink(payload_path)
                  os.unlink(signature_path)

              if new_build <= current_build:
                  raise SystemExit(
                      f"Release build number {new_build} must be greater than the published "
                      f"build number {current_build}."
                  )
          PY

      - name: Verify Android package identity
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.iqtunnel.iq_tunnel'" || {
            echo "Release APK applicationId does not match the package identity established by the reviewed CI APK."
            exit 1
          }

      - name: Verify Android APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SIGNER_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print tolower($2); exit}')"
          EXPECTED_SIGNER_SHA256='cc96499ac23bf3a9101b2a7cc7d19feef852e61a5902860abe15218a8968b017'
          test "$SIGNER_SHA256" = "$EXPECTED_SIGNER_SHA256" || { echo "APK was not signed with the approved permanent IQ Tunnel key"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iq-tunnel-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Xray-core MPL source archive as a release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iq-tunnel-xray-core-v26.11.9-source
          path: |
            build/third-party/xray-core-v26.11.9-source.tar.gz
            build/third-party/xray-core-v26.11.9-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK and signed manifest to Oracle over restricted SFTP
        env:
          ORACLE_SSH_KEY: ${{ secrets.IQT_PROD_ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.IQT_PROD_ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.IQT_PROD_ORACLE_USER }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.IQT_PROD_ORACLE_KNOWN_HOSTS }}
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.IQT_PROD_UPDATE_PRIVATE_KEY_BASE64 }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.release_meta.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import base64, os, re
          host = os.environ["ORACLE_HOST"].strip()
          user = os.environ["ORACLE_USER"].strip()
          version = os.environ["VERSION"].strip()
          build = os.environ["BUILD_NUMBER"].strip()
          if not re.fullmatch(r"[A-Za-z0-9.-]+", host):
              raise SystemExit("ORACLE_HOST contains unsafe characters.")
          if user != "iqt-deploy":
              raise SystemExit("ORACLE_USER must be the dedicated SFTP-only iqt-deploy account.")
          if not re.fullmatch(r"[0-9A-Za-z.+-]+", version):
              raise SystemExit("VERSION contains unsafe characters.")
          if not re.fullmatch(r"[0-9]+", build):
              raise SystemExit("BUILD_NUMBER must be numeric.")
          value = os.environ["ORACLE_SSH_KEY"].replace("\r", "").strip()
          data = value.encode() if "-----BEGIN " in value else base64.b64decode("".join(value.split()), validate=True)
          with open(os.path.expanduser("~/.ssh/id_ed25519"), "wb") as f:
              f.write(data.rstrip() + bytes([10]))
          known = os.environ["ORACLE_KNOWN_HOSTS"].strip() + "\n"
          if not known.strip():
              raise SystemExit("ORACLE_KNOWN_HOSTS is empty.")
          with open(os.path.expanduser("~/.ssh/known_hosts"), "w") as f:
              f.write(known)
          PY
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          # The OpenSSH batch command is "rename", not "posix-rename".
          # The OpenSSH client automatically uses posix-rename@openssh.com when
          # the server advertises it. Probe by replacing an existing zero-byte
          # destination and assert that the client actually sends the extension.
          PROBE_SOURCE="/.iqt-$GITHUB_RUN_ID.rename-source.tmp"
          PROBE_TARGET="/.iqt-$GITHUB_RUN_ID.rename-target.tmp"
          : > /tmp/iqt-sftp-rename-probe-source
          : > /tmp/iqt-sftp-rename-probe-target
          cleanup_sftp_probe() {
            sftp -b - \
              -i ~/.ssh/id_ed25519 \
              -oBatchMode=yes \
              -oStrictHostKeyChecking=yes \
              -oUserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -oIdentitiesOnly=yes \
              "$ORACLE_USER@$ORACLE_HOST" >/dev/null 2>&1 <<SFTP_CLEANUP || true
          -rm $PROBE_SOURCE
          -rm $PROBE_TARGET
          SFTP_CLEANUP
            rm -f /tmp/iqt-sftp-rename-probe-source /tmp/iqt-sftp-rename-probe-target
          }
          trap cleanup_sftp_probe EXIT

          sftp -vv -b - \
            -i ~/.ssh/id_ed25519 \
            -oBatchMode=yes \
            -oStrictHostKeyChecking=yes \
            -oUserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -oIdentitiesOnly=yes \
            "$ORACLE_USER@$ORACLE_HOST" > /tmp/iqt-sftp-capabilities.log 2>&1 <<SFTP_PROBE
          pwd
          put /tmp/iqt-sftp-rename-probe-source $PROBE_SOURCE
          put /tmp/iqt-sftp-rename-probe-target $PROBE_TARGET
          rename $PROBE_SOURCE $PROBE_TARGET
          rm $PROBE_TARGET
          SFTP_PROBE
          grep -Fq 'Remote working directory: /' /tmp/iqt-sftp-capabilities.log || {
            echo "SFTP account did not start at its jailed root; refusing to publish."
            exit 1
          }
          grep -Fq 'Sending SSH2_FXP_EXTENDED(posix-rename@openssh.com)' /tmp/iqt-sftp-capabilities.log || {
            echo "OpenSSH did not perform POSIX replacement during the SFTP preflight; refusing to publish."
            exit 1
          }

          printf '%s' "$UPDATE_PRIVATE_KEY_BASE64" | tr -d '[:space:]' | base64 --decode > /tmp/iq-update-private.pem
          python3 - <<'PY'
          import base64, hashlib, json, os
          apk = "build/app/outputs/flutter-apk/app-release.apk"
          with open(apk, "rb") as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          with open("/tmp/iq-update-apk.sha256", "w", encoding="ascii") as f:
              f.write(digest)
          manifest = {
              "version": os.environ["VERSION"],
              "build_number": int(os.environ["BUILD_NUMBER"]),
              "download_url": "https://mahmoudaljuorany.store/updates/iq-tunnel/iq-tunnel-" + os.environ["VERSION"] + "-" + os.environ["BUILD_NUMBER"] + ".apk",
              "sha256": digest,
              "notes": "تحديثات وتحسينات وإصلاحات لهذا الإصدار."
          }
          payload = json.dumps(manifest, ensure_ascii=False, separators=(",", ":")).encode()
          open("/tmp/iq-update-payload.json", "wb").write(payload)
          with open("/tmp/iq-update-manifest-base.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, separators=(",", ":"))
          PY
          openssl pkeyutl -sign -rawin -inkey /tmp/iq-update-private.pem -in /tmp/iq-update-payload.json -out /tmp/iq-update-signature.bin
          test "$(wc -c < /tmp/iq-update-signature.bin)" -eq 64
          openssl pkeyutl -verify -rawin -pubin -inkey /tmp/iq-update-public.pem -sigfile /tmp/iq-update-signature.bin -in /tmp/iq-update-payload.json
          python3 - <<'PY'
          import base64, json
          with open("/tmp/iq-update-manifest-base.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("/tmp/iq-update-signature.bin", "rb") as f:
              manifest["signature"] = base64.b64encode(f.read()).decode()
          with open("/tmp/iq-update-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, separators=(",", ":"))
          PY

          sftp -b - \
            -i ~/.ssh/id_ed25519 \
            -oBatchMode=yes \
            -oStrictHostKeyChecking=yes \
            -oUserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -oIdentitiesOnly=yes \
            "$ORACLE_USER@$ORACLE_HOST" <<SFTP_BATCH
          put build/app/outputs/flutter-apk/app-release.apk /.iqt-$GITHUB_RUN_ID.apk.tmp
          rename /.iqt-$GITHUB_RUN_ID.apk.tmp /iq-tunnel-$VERSION-$BUILD_NUMBER.apk
          put build/third-party/xray-core-v26.11.9-source.tar.gz /.iqt-$GITHUB_RUN_ID.xray.tmp
          rename /.iqt-$GITHUB_RUN_ID.xray.tmp /xray-core-v26.11.9-source.tar.gz
          put build/third-party/xray-core-v26.11.9-source.tar.gz.sha256 /.iqt-$GITHUB_RUN_ID.sha256.tmp
          rename /.iqt-$GITHUB_RUN_ID.sha256.tmp /xray-core-v26.11.9-source.tar.gz.sha256
          put /tmp/iq-update-manifest.json /.manifest-$GITHUB_RUN_ID.tmp
          rename /.manifest-$GITHUB_RUN_ID.tmp /manifest.json
          SFTP_BATCH

          PUBLIC_BASE="https://mahmoudaljuorany.store/updates/iq-tunnel"
          APK_URL="$PUBLIC_BASE/iq-tunnel-$VERSION-$BUILD_NUMBER.apk"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 -D /tmp/iq-update-apk-headers.txt "$APK_URL" -o /tmp/iq-update-apk-published.apk
          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path("/tmp/iq-update-apk-headers.txt").read_text(encoding="iso-8859-1")
          blocks = re.split(r"\r?\n\r?\n", raw.strip())
          final = next((block for block in reversed(blocks) if block.startswith("HTTP/")), "")
          if not final:
              raise SystemExit("Could not determine final APK HTTP response headers.")
          lines = final.splitlines()
          if not re.match(r"^HTTP/\S+ 200(?:\s|$)", lines[0]):
              raise SystemExit("Published APK endpoint did not return HTTP 200.")
          lengths = [line.split(":", 1)[1].strip() for line in lines[1:] if line.lower().startswith("content-length:")]
          if len(lengths) != 1 or not lengths[0].isdigit() or int(lengths[0]) <= 0:
              raise SystemExit("Published APK endpoint must provide one positive Content-Length.")
          actual_size = Path("/tmp/iq-update-apk-published.apk").stat().st_size
          if int(lengths[0]) != actual_size:
              raise SystemExit(
                  f"Published APK Content-Length ({lengths[0]}) does not match downloaded size ({actual_size})."
              )
          print(f"Verified positive APK Content-Length: {actual_size} bytes")
          PY
          EXPECTED_APK_SHA256="$(cat /tmp/iq-update-apk.sha256)"
          ACTUAL_APK_SHA256="$(sha256sum /tmp/iq-update-apk-published.apk | awk '{print $1}')"
          test "$ACTUAL_APK_SHA256" = "$EXPECTED_APK_SHA256" || {
            echo "Published APK SHA-256 does not match the locally built APK."
            exit 1
          }
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --head "$PUBLIC_BASE/xray-core-v26.11.9-source.tar.gz" >/dev/null
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --head "$PUBLIC_BASE/xray-core-v26.11.9-source.tar.gz.sha256" >/dev/null
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' "$PUBLIC_BASE/manifest.json" -o /tmp/iq-update-manifest-published.json
          cmp --silent /tmp/iq-update-manifest.json /tmp/iq-update-manifest-published.json

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks ~/.ssh/id_ed25519 /tmp/iq-update-private.pem /tmp/iq-update-public.pem /tmp/iq-update-payload.json /tmp/iq-update-manifest-base.json /tmp/iq-update-signature.bin /tmp/iq-update-manifest.json /tmp/iq-update-apk.sha256 /tmp/iq-update-apk-published.apk /tmp/iq-update-apk-headers.txt /tmp/iqt-sftp-capabilities.log
